[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "a7r3-full-touch"
version = "0.17.0"
description = "Full touchscreen UI router and JPEG/RAW two-finger pinch-to-zoom runtime (V17) for Sony Alpha 7R III (ILCE-7RM3 FW 3.10)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
unicorn = ["unicorn>=2.0.0"]

[project.urls]
Homepage = "https://github.com/kan-xx/a7r3-full-touch"
Repository = "https://github.com/kan-xx/a7r3-full-touch"
